<div id="loader">
    <h1>⚡ Mega Calc Pro</h1>
    <div id="count">5</div>
</div>

<style>
#loader{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:#00ffcc;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999999;
    font-family:Arial;
}

#loader h1{
    font-size:40px;
    margin-bottom:20px;
}

#count{
    font-size:60px;
    font-weight:bold;
    text-shadow:0 0 20px #00ffcc;
}
</style>

<script>
let timeLeft = 5;

const countElement = document.getElementById("count");

const timer = setInterval(() => {
    timeLeft--;
    countElement.innerText = timeLeft;

    if(timeLeft <= 0){
        clearInterval(timer);

        document.getElementById("loader").style.display = "none";
    }

},1000);
</script>
